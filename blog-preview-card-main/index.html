<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Blog preview card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page-wrapper">
      <article class="blog-card">
        <img
          class="illustration"
          src="assets/images/illustration-article.svg"
          alt="Illustration of HTML and CSS coding"
        />
        <p class="category-label">Learning</p>
        <time class="publish-date" datetime="2023-12-21"
          >Published 21 Dec 2023</time
        >
        <h1 class="main-heading">HTML & CSS foundations</h1>
        <p class="description">
          These languages are the backbone of every website, defining structure,
          content, and presentation.
        </p>
        <figure class="author-info">
          <img
            class="author-avatar"
            src="assets/images/image-avatar.webp"
            alt="Greg Hooper"
          />
          <figcaption class="author-name">Greg Hooper</figcaption>
        </figure>
      </article>
    </main>

    <!-- <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer> -->
  </body>
</html>
