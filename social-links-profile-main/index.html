<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./style.css" />
    <title>Frontend Mentor | Social links profile</title>
  </head>
  <body>
    <main class="wrapper">
      <article class="card">
        <img
          class="avatar"
          src="./assets/images/avatar-jessica.jpeg"
          alt="Jessica Randall"
        />
        <h1 class="username">Jessica Randall</h1>
        <p class="location">London, United Kingdom</p>
        <p class="description">"Front-end developer and avid reader."</p>
        <nav class="social-links">
          <ul>
            <li>
              <a href="https://github.com/" class="social-link" rel="noopener noreferrer"
                >GitHub</a
              >
            </li>
            <li>
              <a href="https://www.frontendmentor.io/" class="social-link" rel="noopener noreferrer"
                >Frontend Mentor</a
              >
            </li>
            <li>
              <a href="https://www.linkedin.com/" class="social-link" rel="noopener noreferrer"
                >LinkedIn</a
              >
            </li>
            <li>
              <a href="https://x.com/" class="social-link" rel="noopener noreferrer"
                >Twitter</a
              >
            </li>
            <li>
              <a href="https://www.instagram.com/" class="social-link" rel="noopener noreferrer"
                >Instagram</a
              >
            </li>
          </ul>
        </nav>
      </article>
    </main>

    <!-- <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer> -->
  </body>
</html>
